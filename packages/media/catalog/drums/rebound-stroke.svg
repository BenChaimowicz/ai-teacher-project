<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">The full (rebound) stroke, in four stills</title>
  <desc id="d">Four side views of a drumstick above a drum, left to right. 1: the stick is raised high, pivoting at the fulcrum, with an arrow showing it falling. 2: the tip strikes the drumhead. 3: the stick bounces back up off the head, with an arrow pointing up. 4: the stick is high again, at the same height as in the first frame, marked by a dashed line.</desc>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #222; }
    .title { font-size: 20px; font-weight: 700; }
    .step { font-size: 17px; font-weight: 700; }
    .sub { font-size: 14px; fill: #444; }
    .note { font-size: 13px; fill: #555; }
    .small { font-size: 12px; fill: #555; }
    .shell { fill: #e9e4dc; stroke: #333; stroke-width: 1.6; }
    .head { stroke: #111; stroke-width: 4; stroke-linecap: round; }
    .rim { stroke: #333; stroke-width: 1.6; }
    .stick { stroke: #8a5a2b; stroke-width: 9; stroke-linecap: round; }
    .taper { stroke: #8a5a2b; stroke-width: 6; stroke-linecap: round; }
    .tip { fill: #6b4420; }
    .pivot { fill: #fff; stroke: #111; stroke-width: 2.2; }
    .move { fill: none; stroke: #c0392b; stroke-width: 2.6; }
    .guide { stroke: #888; stroke-width: 1.4; stroke-dasharray: 7 6; }
    .hit { stroke: #c0392b; stroke-width: 2.4; stroke-linecap: round; }
    .next { fill: none; stroke: #999; stroke-width: 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#fff"/>
  <text class="title" x="20" y="34">The full (rebound) stroke, in four stills</text>
  <line class="guide" x1="20" y1="92.4" x2="890" y2="92.4"/>
  <text class="small" x="945" y="88.4" text-anchor="end">starting</text>
  <text class="small" x="945" y="104.4" text-anchor="end">height</text>
  <!-- frame 1 -->
  <g>
    <rect class="shell" x="100" y="252" width="140" height="44"/>
    <line class="rim" x1="96" y1="252" x2="244" y2="252"/>
    <line class="rim" x1="96" y1="296" x2="244" y2="296"/>
    <line class="head" x1="100" y1="250" x2="240" y2="250"/>
    <line class="stick" x1="47.5" y1="252.6" x2="126.0" y2="116.7"/>
    <line class="taper" x1="126.0" y1="116.7" x2="140.0" y2="92.4"/>
    <circle class="tip" cx="140.0" cy="92.4" r="5.5"/>
    <circle class="pivot" cx="75.0" cy="205.0" r="6"/>
    <text class="small" x="63.0" y="209.0" text-anchor="end">fulcrum</text>
    <path class="move" d="M 156.0 96.4 Q 220 150 206 232" marker-end="url(#arrow)"/>
    <text class="small" x="222" y="165">falls</text>
    <text class="step" x="40" y="332">1  Up</text>
    <text class="sub" x="40" y="352">Held high, ready</text>
  </g>
  <line class="next" x1="246" y1="274" x2="270" y2="274" marker-end="url(#gray)"/>
  <!-- frame 2 -->
  <g>
    <rect class="shell" x="335" y="252" width="140" height="44"/>
    <line class="rim" x1="331" y1="252" x2="479" y2="252"/>
    <line class="rim" x1="331" y1="296" x2="479" y2="296"/>
    <line class="head" x1="335" y1="250" x2="475" y2="250"/>
    <line class="stick" x1="258.4" y1="186.0" x2="405.7" y2="240.3"/>
    <line class="taper" x1="405.7" y1="240.3" x2="432.0" y2="250.0"/>
    <circle class="tip" cx="432.0" cy="250.0" r="5.5"/>
    <circle class="pivot" cx="310.0" cy="205.0" r="6"/>
    <line class="hit" x1="424.8" y1="240.6" x2="416.0" y2="234.0"/>
    <line class="hit" x1="432.0" y1="237.0" x2="432.0" y2="226.0"/>
    <line class="hit" x1="439.2" y1="240.6" x2="448.0" y2="234.0"/>
    <text class="step" x="275" y="332">2  Strike</text>
    <text class="sub" x="275" y="352">The tip hits the head</text>
  </g>
  <line class="next" x1="481" y1="274" x2="505" y2="274" marker-end="url(#gray)"/>
  <!-- frame 3 -->
  <g>
    <rect class="shell" x="570" y="252" width="140" height="44"/>
    <line class="rim" x1="566" y1="252" x2="714" y2="252"/>
    <line class="rim" x1="566" y1="296" x2="714" y2="296"/>
    <line class="head" x1="570" y1="250" x2="710" y2="250"/>
    <line class="stick" x1="495.2" y1="228.2" x2="637.4" y2="161.9"/>
    <line class="taper" x1="637.4" y1="161.9" x2="662.8" y2="150.1"/>
    <circle class="tip" cx="662.8" cy="150.1" r="5.5"/>
    <circle class="pivot" cx="545.0" cy="205.0" r="6"/>
    <path class="move" d="M 686 236 Q 704 190 680 114.1" marker-end="url(#arrow)"/>
    <text class="small" x="698" y="200">bounces</text>
    <text class="small" x="698" y="215">back up</text>
    <text class="step" x="510" y="332">3  Rebound</text>
    <text class="sub" x="510" y="352">The head bounces it back up</text>
  </g>
  <line class="next" x1="716" y1="274" x2="740" y2="274" marker-end="url(#gray)"/>
  <!-- frame 4 -->
  <g>
    <rect class="shell" x="805" y="252" width="140" height="44"/>
    <line class="rim" x1="801" y1="252" x2="949" y2="252"/>
    <line class="rim" x1="801" y1="296" x2="949" y2="296"/>
    <line class="head" x1="805" y1="250" x2="945" y2="250"/>
    <line class="stick" x1="752.5" y1="252.6" x2="831.0" y2="116.7"/>
    <line class="taper" x1="831.0" y1="116.7" x2="845.0" y2="92.4"/>
    <circle class="tip" cx="845.0" cy="92.4" r="5.5"/>
    <circle class="pivot" cx="780.0" cy="205.0" r="6"/>
    <text class="step" x="745" y="332">4  Up again</text>
    <text class="sub" x="745" y="352">Back at the starting height</text>
  </g>
  <text class="note" x="20" y="386">In a full stroke the stick starts and ends at the same height: the player lets it bounce back off the head instead of pressing it into the head.</text>
</svg>
