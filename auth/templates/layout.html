<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>Knibbler</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background:#0b0e18;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#0b0e18;">
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
        <tr>
          <td style="padding:0 4px 18px;font-family:'Baloo 2',ui-rounded,'Segoe UI',Arial,sans-serif;font-size:24px;font-weight:700;color:#d8955c;letter-spacing:0.2px;">
            Knibbler
          </td>
        </tr>
        <tr>
          <td style="background:#141a2e;border-radius:14px;padding:32px 28px;font-family:Manrope,'Segoe UI',Arial,sans-serif;font-size:16px;line-height:1.6;color:#ebe6dc;">
            {{CONTENT}}
          </td>
        </tr>
        <tr>
          <td style="padding:18px 4px 0;font-family:Manrope,'Segoe UI',Arial,sans-serif;font-size:12px;line-height:1.5;color:#8a8ba0;">
            You got this email because someone used {{ .Email }} on Knibbler. If that wasn't you, you can ignore it.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
