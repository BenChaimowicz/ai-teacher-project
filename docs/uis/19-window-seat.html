<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>19 Window Seat — Night Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #101114;
    --text: #f7eee0;
    --muted: #a79a8d;
    --amber: #f4c47d;
    --paper: #efe4cc;
    --ink: #2a231c;
    --cushion: #3a2a28;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    color: var(--text);
    background: #0e0f12;
    font-family: Figtree, system-ui, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 28px; position: relative; z-index: 3;
  }
  .brand { font-family: Fraunces, Georgia, serif; font-size: 20px; }
  .brand span { color: var(--amber); }
  nav a { color: var(--muted); text-decoration: none; margin-left: 18px; font-size: 14px; }
  nav a:hover { color: var(--text); }

  .room { padding: 0 28px 110px; }
  .window {
    position: relative; height: min(52vh, 420px); overflow: hidden;
    border: 10px solid #1c1816; border-bottom-width: 18px; border-radius: 6px 6px 0 0;
    background:
      radial-gradient(circle at 78% 28%, #f4e2b0 0 2px, transparent 3px),
      radial-gradient(circle at 22% 40%, rgba(255,255,255,0.5) 0 1px, transparent 2px),
      linear-gradient(#151820, #0b0d14 55%, #1a1520);
    box-shadow: inset 0 0 80px rgba(0,0,0,0.35);
  }
  .moon {
    position: absolute; top: 18%; right: 16%; width: 56px; height: 56px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff6d6, #d9c48a);
    box-shadow: 0 0 40px rgba(244, 226, 176, 0.45);
  }
  .rain {
    position: absolute; inset: 0; pointer-events: none; opacity: 0.35;
    background-image: repeating-linear-gradient(105deg, transparent 0 18px, rgba(180,200,220,0.18) 19px, transparent 20px);
    animation: rain 1.2s linear infinite;
  }
  @keyframes rain { to { background-position: 40px 80px; } }
  .mullion {
    position: absolute; inset: 0;
    background:
      linear-gradient(#2a2420, #2a2420) 50% / 8px 100% no-repeat,
      linear-gradient(#2a2420, #2a2420) 0 42% / 100% 8px no-repeat;
    pointer-events: none;
  }

  .seat {
    position: relative;
    min-height: 340px;
    padding: 28px 32px 24px;
    background:
      linear-gradient(180deg, #4a3530, var(--cushion) 30%, #2b1e1c);
    border-radius: 0 0 18px 18px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4);
  }
  .pile {
    position: absolute; left: 36px; bottom: 36px;
    width: 210px; height: 230px;
  }
  .cover {
    position: absolute; left: 0; width: 150px; height: 200px; padding: 16px 14px;
    border: 0; cursor: pointer; text-align: left;
    border-radius: 3px 8px 8px 3px;
    box-shadow: 8px 12px 18px rgba(0,0,0,0.35);
    color: #f7eee0; font-family: Fraunces, Georgia, serif;
    transition: transform .3s ease;
  }
  .cover small { display: block; opacity: 0.7; font-family: Figtree, sans-serif; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
  .cover b { font-weight: 500; font-size: 16px; line-height: 1.25; }
  .cover:nth-child(1) { transform: rotate(-12deg); z-index: 1; }
  .cover:nth-child(2) { transform: rotate(-4deg) translate(18px, -8px); z-index: 2; }
  .cover:nth-child(3) { transform: rotate(6deg) translate(40px, -4px); z-index: 3; }
  .cover:hover { z-index: 5; transform: rotate(0deg) translateY(-14px) scale(1.04); }

  .lap {
    margin-left: min(280px, 32%);
    max-width: 520px;
    background: var(--paper); color: var(--ink);
    padding: 28px 30px 24px;
    border-radius: 3px;
    box-shadow: 14px 18px 0 rgba(20,12,10,0.25), 0 20px 40px rgba(0,0,0,0.25);
    transform: rotate(-1.5deg);
  }
  .lap .label { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #7a6b56; }
  .lap h1 { font-family: Fraunces, Georgia, serif; font-size: 28px; font-weight: 500; margin: 8px 0 12px; }
  .lap p { font-family: Fraunces, Georgia, serif; font-size: 16px; line-height: 1.65; }
  .lap .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 12px; }
  .continue {
    padding: 10px 14px; border: 0; border-radius: 3px; cursor: pointer;
    background: #2a231c; color: var(--paper); font-weight: 700; font-size: 13px;
  }
  .ask {
    margin-top: 18px; display: flex; gap: 8px;
    border-bottom: 1px solid rgba(42,35,28,0.18); padding-bottom: 8px;
  }
  .ask input {
    flex: 1; background: none; border: 0; outline: none; color: var(--ink);
    font-family: Fraunces, Georgia, serif; font-style: italic; font-size: 16px;
  }

  .cat {
    position: absolute; right: 48px; bottom: 28px; width: 74px; height: 42px;
    opacity: 0.85; filter: drop-shadow(0 8px 8px rgba(0,0,0,0.35));
  }

  .compare {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 9;
    display: flex; gap: 4px; padding: 6px; background: #1a1614; border: 1px solid rgba(255,220,171,0.18);
    border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .compare a { padding: 8px 12px; border-radius: 999px; color: #a79a8d; text-decoration: none; font-size: 12px; font-weight: 600; }
  .compare a[aria-current] { background: #f4c47d; color: #24170d; }

  @media (prefers-reduced-motion: reduce) {
    .rain { animation: none; }
  }
  @media (max-width: 780px) {
    .pile { position: relative; left: 0; bottom: 0; margin-bottom: 18px; }
    .lap { margin-left: 0; }
    .cat { display: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">the study / <span>window seat</span></div>
    <nav>
      <a href="#">Tonight</a>
      <a href="#">The pile</a>
      <a href="#">Notes</a>
    </nav>
  </header>

  <div class="room">
    <div class="window" aria-hidden="true">
      <div class="moon"></div>
      <div class="rain"></div>
      <div class="mullion"></div>
    </div>

    <div class="seat">
      <div class="pile" id="pile"></div>
      <article class="lap" id="lap"></article>
      <svg class="cat" viewBox="0 0 74 42" aria-hidden="true">
        <ellipse cx="38" cy="28" rx="26" ry="12" fill="#1a1412"/>
        <circle cx="22" cy="18" r="11" fill="#1a1412"/>
        <path d="M14 12 l4 8 l-8 1 z" fill="#1a1412"/>
        <path d="M26 11 l5 8 l-9 0 z" fill="#1a1412"/>
        <path d="M58 26 q12 2 14 10" stroke="#1a1412" stroke-width="4" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <nav class="compare" aria-label="Night Library options">
    <a href="16-night-library.html">16 Shelf</a>
    <a href="17-open-volume.html">17 Open volume</a>
    <a href="18-the-stacks.html">18 Stacks</a>
    <a href="19-window-seat.html" aria-current="page">19 Window seat</a>
  </nav>

<script>
  const books = [
    { id: "ai", title: "Artificial intelligence, explained", disc: "Systems", next: "How machines learn", body: "A model is not a mind. Sit with that for a page, then we will watch one learn from an example you already know.", cover: "#5b4a77" },
    { id: "write", title: "Writing that feels alive", disc: "Language", next: "Cut until it breathes", body: "Rain on the glass, a sentence on the page. Keep only the words that still sound like you.", cover: "#814c59" },
    { id: "learn", title: "Learning how to learn", disc: "Science", next: "Interleaving practice", body: "The pile is the point. A little of this, a little of that, then back again.", cover: "#3d6260" },
  ];
  let current = "ai";

  function render() {
    document.getElementById("pile").innerHTML = books.map((b) =>
      `<button class="cover" data-id="${b.id}" style="background:${b.cover}"><small>${b.disc}</small><b>${b.title}</b></button>`
    ).join("");
    const b = books.find((x) => x.id === current);
    document.getElementById("lap").innerHTML = `
      <p class="label">On your lap · ${b.disc}</p>
      <h1>${b.title}</h1>
      <p>${b.body}</p>
      <div class="foot">
        <span>Next: ${b.next} · 16 min</span>
        <button class="continue" id="go">Keep reading →</button>
      </div>
      <form class="ask" id="ask">
        <input name="q" placeholder="Leave a new book on the seat…" />
      </form>`;
    document.getElementById("go").onclick = () => { document.getElementById("go").textContent = "Lamp still on."; };
    document.getElementById("ask").onsubmit = (e) => {
      e.preventDefault();
      const q = new FormData(e.target).get("q").toString().trim();
      if (!q) return;
      books.unshift({ id: "new", title: q, disc: "New", next: "A first question", body: "Four questions, then chapter one. The rain can keep talking.", cover: "#7c6a3e" });
      current = "new";
      render();
    };
  }
  document.getElementById("pile").addEventListener("click", (e) => {
    const btn = e.target.closest(".cover");
    if (!btn) return;
    current = btn.dataset.id;
    render();
  });
  render();
</script>
</body>
</html>
