<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>17 Open Volume — Night Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #12100f;
    --wood: #2a201b;
    --text: #f7eee0;
    --muted: #a79a8d;
    --amber: #f4c47d;
    --paper: #efe4cc;
    --paper-2: #e6d7b8;
    --ink: #2a231c;
    --rule: rgba(42, 35, 28, 0.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    color: var(--text);
    background:
      radial-gradient(ellipse at 50% 0%, rgba(244,196,125,0.12), transparent 42%),
      var(--bg);
    font-family: Figtree, system-ui, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  .top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 22px 28px 8px;
  }
  .brand { font-family: Fraunces, Georgia, serif; font-size: 20px; }
  .brand span { color: var(--amber); }
  .hours { color: var(--muted); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }

  .table {
    padding: 12px 28px 110px;
    display: grid; place-items: center;
  }
  .spread {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    width: min(1080px, 100%);
    min-height: 640px;
    color: var(--ink);
    background: var(--paper);
    border-radius: 4px 12px 12px 4px;
    box-shadow:
      0 40px 80px rgba(0,0,0,0.45),
      inset 0 0 0 1px rgba(255,255,255,0.25);
  }
  .spread::before {
    content: "";
    position: absolute; inset: 0 50% 0 0;
    background: linear-gradient(90deg, transparent 70%, rgba(80,50,20,0.08));
    pointer-events: none;
  }
  .spread::after {
    content: "";
    position: absolute; top: 0; bottom: 0; left: 50%; width: 28px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, rgba(0,0,0,0.12), transparent 40%, transparent 60%, rgba(0,0,0,0.12));
    pointer-events: none;
  }
  .page { padding: 42px 48px 36px; position: relative; z-index: 1; }
  .page.right { padding-left: 56px; background: linear-gradient(90deg, rgba(90,60,20,0.05), transparent 18%); }
  .folio {
    color: #8a7a64; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 18px;
  }
  h1 { font-family: Fraunces, Georgia, serif; font-size: 34px; font-weight: 500; letter-spacing: -0.03em; }
  .lede { margin-top: 8px; color: #6d6254; font-style: italic; }

  .toc { margin-top: 28px; display: grid; gap: 2px; }
  .toc button {
    display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline;
    width: 100%; padding: 9px 6px; text-align: left; cursor: pointer;
    background: none; border: 0; color: var(--ink); border-radius: 4px;
  }
  .toc button:hover, .toc button.active { background: rgba(42,35,28,0.06); }
  .toc .num { color: #8a7a64; font-size: 12px; font-variant-numeric: oldstyle-nums; }
  .toc .title { font-family: Fraunces, Georgia, serif; font-size: 16px; }
  .toc .dots { border-bottom: 1px dotted rgba(42,35,28,0.28); transform: translateY(-4px); }
  .toc .pg { color: #8a7a64; font-size: 12px; }

  .chapter { font-family: Fraunces, Georgia, serif; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #8a7a64; }
  .page h2 { font-family: Fraunces, Georgia, serif; font-size: 28px; font-weight: 500; margin: 8px 0 14px; }
  .excerpt { font-family: Fraunces, Georgia, serif; font-size: 17px; line-height: 1.7; max-width: 36ch; }
  .meta { margin-top: 22px; color: #6d6254; font-size: 13px; }
  .open {
    margin-top: 22px; padding: 11px 16px; cursor: pointer; border: 0; border-radius: 3px;
    background: #2a231c; color: var(--paper); font-weight: 700; font-size: 13px;
  }
  .rule-line {
    margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--rule);
  }
  .rule-line label { display: block; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8a7a64; margin-bottom: 8px; }
  .rule-line input {
    width: 100%; background: transparent; border: 0; outline: none;
    font-family: Fraunces, Georgia, serif; font-size: 18px; font-style: italic; color: var(--ink);
    border-bottom: 1px solid var(--rule); padding-bottom: 8px;
  }
  .ribbon {
    position: absolute; top: -6px; right: 18%; width: 16px; height: 90px; z-index: 2;
    background: #9b3b3b; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 86%, 0 100%);
    box-shadow: 2px 8px 10px rgba(0,0,0,0.2);
  }
  .compare {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 9;
    display: flex; gap: 4px; padding: 6px; background: #1a1614; border: 1px solid rgba(255,220,171,0.18);
    border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .compare a {
    padding: 8px 12px; border-radius: 999px; color: #a79a8d; text-decoration: none; font-size: 12px; font-weight: 600;
  }
  .compare a[aria-current] { background: #f4c47d; color: #24170d; }
  @media (max-width: 820px) {
    .spread { grid-template-columns: 1fr; min-height: auto; }
    .spread::after, .ribbon { display: none; }
    .page.right { padding-left: 48px; }
  }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">the study / <span>open volume</span></div>
    <div class="hours">Reading room · always open</div>
  </div>

  <div class="table">
    <div class="spread">
      <div class="ribbon" aria-hidden="true"></div>
      <section class="page">
        <p class="folio">Contents</p>
        <h1>Your library</h1>
        <p class="lede">Six volumes in progress. Mark the one you want on the facing page.</p>
        <div class="toc" id="toc"></div>
      </section>
      <section class="page right">
        <p class="folio" id="folio">Plate IV</p>
        <p class="chapter" id="chapter"></p>
        <h2 id="title"></h2>
        <p class="excerpt" id="excerpt"></p>
        <p class="meta" id="meta"></p>
        <button class="open" id="open">Continue this chapter →</button>
        <div class="rule-line">
          <label for="ask">Or begin a new volume</label>
          <input id="ask" placeholder="What have you been wondering about?" />
        </div>
      </section>
    </div>
  </div>

  <nav class="compare" aria-label="Night Library options">
    <a href="16-night-library.html">16 Shelf</a>
    <a href="17-open-volume.html" aria-current="page">17 Open volume</a>
    <a href="18-the-stacks.html">18 Stacks</a>
    <a href="19-window-seat.html">19 Window seat</a>
  </nav>

<script>
  const books = [
    { id: "images", title: "The language of images", chapter: "Craft · Ch. 3", excerpt: "A picture is a sentence with the grammar hidden in the edges. We start by learning to see the frame before the subject.", meta: "Next: Framing as a sentence · 14 min", page: "28" },
    { id: "psych", title: "A practical guide to psychology", chapter: "Science · Ch. 2", excerpt: "Attention is a scarce material. Treat it like one, and the rest of the mind becomes easier to work with.", meta: "Next: Attention, not willpower · 18 min", page: "19" },
    { id: "creative", title: "Creative confidence", chapter: "Craft · Ch. 5", excerpt: "The ugly first draft is not a failure of taste. It is the only honest way a thing begins.", meta: "Next: The ugly first draft · 12 min", page: "54" },
    { id: "ai", title: "Artificial intelligence, explained", chapter: "Systems · Ch. 4", excerpt: "A model is not a mind. It is a compressed map of patterns that used to live in the world — useful, incomplete, and ours to read carefully.", meta: "Next: How machines learn · 16 min", page: "33" },
    { id: "learn", title: "Learning how to learn", chapter: "Science · Ch. 6", excerpt: "You do not rise to the level of your goals. You fall to the level of your practice.", meta: "Next: Interleaving practice · 11 min", page: "61" },
    { id: "write", title: "Writing that feels alive", chapter: "Language · Ch. 7", excerpt: "Cut until the sentence can breathe on its own. What remains is usually the thing you meant.", meta: "Next: Cut until it breathes · 13 min", page: "58" },
  ];
  let current = "ai";
  const toc = document.getElementById("toc");

  function render() {
    const b = books.find((x) => x.id === current);
    toc.innerHTML = books.map((x, i) =>
      `<button class="${x.id === current ? "active" : ""}" data-id="${x.id}">
        <span class="num">${String(i + 1).padStart(2, "0")}</span>
        <span class="title">${x.title}</span>
        <span class="dots"></span>
        <span class="pg">${x.page}</span>
      </button>`
    ).join("");
    document.getElementById("chapter").textContent = b.chapter;
    document.getElementById("title").textContent = b.title;
    document.getElementById("excerpt").textContent = b.excerpt;
    document.getElementById("meta").textContent = b.meta;
    document.getElementById("folio").textContent = "Plate " + ["I","II","III","IV","V","VI"][books.findIndex((x) => x.id === current)];
  }
  toc.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    current = btn.dataset.id;
    render();
  });
  document.getElementById("open").addEventListener("click", () => {
    document.getElementById("open").textContent = "Page marked · sit down whenever you like";
  });
  document.getElementById("ask").addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || !e.target.value.trim()) return;
    books.unshift({ id: "new", title: e.target.value.trim(), chapter: "New volume · Ch. 1", excerpt: "Four questions, then chapter one. We will write this one to your hand.", meta: "Next: A first question · 10 min", page: "1" });
    current = "new";
    e.target.value = "";
    render();
  });
  render();
</script>
</body>
</html>
